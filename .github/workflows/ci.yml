name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
          - os: ubuntu-24.04
            # Electron needs a display, and the runner has none.
            display: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm from package.json's packageManager field and the Node
      # from .tool-versions, then runs pnpm install --frozen-lockfile.
      - uses: pnpm/setup@v3
        with:
          node-version-file: .tool-versions
          cache: true
          require-lockfile: true

      # Electron 44 has no install script. It downloads its binary on first use.
      - name: Download Electron
        run: pnpm exec install-electron

      # Ubuntu 24.04's AppArmor policy blocks the user namespaces Electron's
      # sandbox needs, and Electron won't launch without it.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: ${{ matrix.display }} pnpm smoke
      - run: ${{ matrix.display }} pnpm e2e

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    env:
      VERSION: 0.0.0-ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          node-version-file: .tool-versions
          cache: true
          require-lockfile: true

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: pnpm package --mac --arch arm64 --version "$VERSION"

      - name: Smoke dmg
        if: runner.os == 'macOS'
        run: |
          mnt="$RUNNER_TEMP/mnt"
          dest="$RUNNER_TEMP/smoke-dmg"
          rm -rf "$dest"
          mkdir -p "$mnt" "$dest"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "dist/Tondo-$VERSION-arm64.dmg" > /dev/null
          ditto "$mnt/Tondo.app" "$dest/Tondo.app"
          hdiutil detach "$mnt"
          node scripts/smoke.mts --app "$dest/Tondo.app"

      - name: Smoke zip
        if: runner.os == 'macOS'
        run: |
          dest="$RUNNER_TEMP/smoke-zip"
          rm -rf "$dest"
          mkdir -p "$dest"
          ditto -x -k "dist/Tondo-$VERSION-arm64.zip" "$dest"
          node scripts/smoke.mts --app "$dest/Tondo.app"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: pnpm package --linux --version "$VERSION"

      - name: Install the deb
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ./dist/*.deb

      # The default AppArmor restriction stays on here: the deb's profile must
      # keep the sandbox working. The sysctl is relaxed only after this smoke.
      - name: Smoke deb (AppArmor restriction on)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/smoke.mts --app /opt/Tondo/tondo

      # AppRun falls back to --no-sandbox when `unshare -Ur true` fails, as it
      # does under the restriction. Relaxing it lets the AppImage run sandboxed.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke AppImage
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          images=(dist/*.AppImage)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage, found ${#images[@]}"
            exit 1
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" node scripts/smoke.mts --app "${images[0]}"
