# pnpm fails the install when a dependency wants to run a build script that
# isn't listed here (strictDepBuilds). Allow only what Tondo needs.
# Electron 44 has no install script: it downloads its binary the first time
# `require("electron")` runs, or when `pnpm exec install-electron` runs.
allowBuilds:
  esbuild: true
  # pi (a devDependency for its RPC types and the fixture recorder) pulls these
  # in. Neither build script is needed.
  "@google/genai": false
  protobufjs: false
